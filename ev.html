<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events TAS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1000;
            opacity: 0;
        }
        .btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        .container {
            max-width: 1400px;
            margin: 70px auto;
            padding: 70px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 25px;
            font-size: 25px;
            color: rgb(54, 82, 41);
        }
        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .title-wrapper h1 {
            font-size: 100px;
            margin: 0;
            line-height: 1.2;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.1);
            border-radius: 40px;
            font-family: 'Itim', cursive;
            color: rgb(109, 173, 77);
        }

        .imglogo {
            width: 80px;
            height: auto;
            border-radius: 1000px;
            display: block;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .title-wrapper h1 {
                font-size: 50px;
            }
            .imglogo {
                width: 50px;
            }
            .container {
                padding: 30px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="btn">
        <button type="button" class="btn btn-info" onclick="window.location.href='index.html'">Back to Home</button>
    </div>
    <div class="container">

        <div class="title-wrapper">
            <h1 class="text-center">Events </h1>
            <img class="imglogo" src="logo.png" alt="event picture">
        </div>
        <ul>
            <li>Vòng quay may mắn có cơ hội trúng thưởng</li>
            <li>Cách sở hữu:</li>
            <li>1 Lượt bằng 1 bill trên 200K</li>
        </ul>
        <img src="events.jpg" alt="events picture" style="width: 100%; height: auto; border-radius: 45px;">
        <iframe width="80" height="80" 
        src="https://youtu.be/xqcC-QRgs78" 
        frameborder="0" allow="autoplay"></iframe>
    </div>
    <div class="footer" style="text-align: center; padding: 20px; background-color: #000000; margin-top: 50px;">
    <p style="color: #ffffff;">&copy; Coffee TAS. All rights reserved.</p>

    <p style="color: #ffffff;">&copy; SĐT: N/A</p>
    <p style="color: #ffffff;">&copy; Địa chỉ: N/A</p>
    <p style="color: #ffffff;">&copy; Facebook: N/A</p>
    <p style="color: #ffffff;">&copy; Hỗ Trợ Khách Hàng</p>
    <p style="color: #ffffff;">&copy; Chính Sách Bảo Mật</p>
    <p style="color: #ffffff;">&copy; Điều Khoản Dịch Vụ</p>
</body>
</html>
